<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>网络/IP 管理 - AI Creator OS</title>
    <link rel="stylesheet" href="/manager/style.css?v=20260615-proxy">
    <style>
      .proxy-grid {
        display: grid;
        gap: 16px;
        margin-top: 16px;
      }
      .proxy-card {
        background: white;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .proxy-info h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .proxy-info p {
        margin: 0;
        font-size: 14px;
        color: #586069;
      }
      .proxy-status {
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
      }
      .proxy-status.active { background: #d4edda; color: #155724; }
      .proxy-status.inactive { background: #f8f9fa; color: #6c757d; }
      .proxy-status.failed { background: #f8d7da; color: #721c24; }
      .import-section {
        background: #f6f8fa;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 24px;
      }
      .import-section textarea {
        width: 100%;
        min-height: 120px;
        font-family: monospace;
        padding: 12px;
        border: 1px solid #e1e4e8;
        border-radius: 6px;
        font-size: 13px;
      }
      .button-group {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: auto;
        background: rgba(16, 24, 20, 0.46);
        backdrop-filter: blur(10px);
      }
      .modal-card {
        width: min(520px, 100%);
        display: grid;
        gap: 16px;
        padding: 22px;
        border: 1px solid var(--line, #dfe5dc);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 28px 90px rgba(22, 34, 28, 0.24);
      }
      .modal-card h2 {
        margin: 0;
        font-size: 18px;
      }
      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .modal-grid .field {
        display: grid;
        gap: 5px;
        color: #647067;
        font-size: 13px;
      }
      .modal-grid .field.full {
        grid-column: 1 / -1;
      }
      .modal-grid input,
      .modal-grid select {
        width: 100%;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid #dfe5dc;
        border-radius: 8px;
        font: inherit;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .safety-note {
        padding: 10px 12px;
        color: #526159;
        border: 1px solid #d8e5dd;
        border-radius: 12px;
        background: #f7fbf8;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header class="shell-header">
      <div>
        <p class="eyebrow">AI Creator OS 桌面版</p>
        <h1>网络/IP 管理</h1>
        <p class="subtitle">管理代理 IP 地址和出口信息，打开固定窗口前检测 IP 是否匹配</p>
      </div>
      <div class="header-actions">
        <button class="button secondary" onclick="goBack()">返回账号列表</button>
        <button class="button" id="addProxyButton">添加代理</button>
      </div>
    </header>

    <main>
      <div class="safety-note">
        <strong>产品边界：</strong>只保存 host:port、国家、城市、状态和备注。不保存 username/password，不自动切换代理，不修改 Electron proxy 配置。打开固定窗口前会检测当前公网 IP 与账号指定 IP 是否匹配。
      </div>

      <section class="import-section">
        <h2>批量导入代理</h2>
        <p style="color: #586069; margin: 8px 0 12px;">支持格式：ip:port 或 protocol://ip:port，每行一个。username/password 会被忽略。</p>
        <textarea id="proxyImportText" placeholder="192.168.1.1:8080
socks5://192.168.1.3:1080
38.154.203.95:5863"></textarea>
        <div class="button-group">
          <button class="button" id="importButton">批量导入</button>
          <button class="button secondary" id="exportButton">导出CSV</button>
        </div>
      </section>

      <section class="panel">
        <h2>代理列表 <span id="proxyCount" style="color: #586069; font-weight: normal;"></span></h2>
        <div id="proxyGrid" class="proxy-grid"></div>
      </section>
    </main>

    <!-- 添加/编辑代理弹窗 -->
    <div class="modal-backdrop" id="proxyModal" hidden>
      <div class="modal-card">
        <h2 id="proxyModalTitle">添加代理</h2>
        <div class="modal-grid">
          <label class="field"><span>名称</span><input id="proxyFormName" type="text" placeholder="例如：日本住宅 1"></label>
          <label class="field"><span>类型</span><select id="proxyFormType"><option value="http">HTTP</option><option value="https">HTTPS</option><option value="socks4">SOCKS4</option><option value="socks5">SOCKS5</option></select></label>
          <label class="field"><span>地址 *</span><input id="proxyFormHost" type="text" placeholder="192.168.1.1" required></label>
          <label class="field"><span>端口 *</span><input id="proxyFormPort" type="number" min="1" max="65535" placeholder="8080" required></label>
          <label class="field"><span>国家</span><input id="proxyFormCountry" type="text" placeholder="日本"></label>
          <label class="field"><span>城市</span><input id="proxyFormCity" type="text" placeholder="东京"></label>
          <label class="field"><span>代理类型</span><select id="proxyFormProxyType"><option value="datacenter">数据中心</option><option value="residential">住宅</option><option value="mobile">移动</option></select></label>
          <label class="field"><span>备注</span><input id="proxyFormNotes" type="text" placeholder="可选备注"></label>
        </div>
        <div class="modal-actions">
          <button class="button secondary" id="proxyModalCancel">取消</button>
          <button class="button" id="proxyModalSave">保存</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module">
      const workspaceId = new URLSearchParams(window.location.search).get('workspaceId') || 'workspace_default';
      let editingProxyId = null;

      async function loadProxies() {
        try {
          const response = await fetch(`/api/desktop/proxies?workspaceId=${workspaceId}`);
          const result = await response.json();
          const items = result.data?.items || result.items || [];
          renderProxies(items);
          document.getElementById('proxyCount').textContent = `(${items.length} 个)`;
        } catch (error) {
          showToast('加载代理列表失败：' + error.message, 'error');
        }
      }

      function renderProxies(proxies) {
        const grid = document.getElementById('proxyGrid');

        if (proxies.length === 0) {
          grid.innerHTML = '<p style="color: #586069; padding: 20px; text-align: center;">暂无代理，请添加或批量导入</p>';
          return;
        }

        grid.innerHTML = proxies.map(proxy => `
          <div class="proxy-card">
            <div class="proxy-info">
              <h3>${proxy.name || proxy.host}:${proxy.port}</h3>
              <p>
                <strong>类型：</strong>${proxy.type || 'http'} |
                <strong>地址：</strong>${proxy.host}:${proxy.port}
                ${proxy.country ? ` | <strong>国家：</strong>${proxy.country}` : ''}
                ${proxy.city ? ` | <strong>城市：</strong>${proxy.city}` : ''}
                ${proxy.responseTime ? ` | <strong>响应：</strong>${proxy.responseTime}ms` : ''}
              </p>
              ${proxy.notes ? `<p style="margin-top: 8px; font-size: 13px;">${proxy.notes}</p>` : ''}
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
              <span class="proxy-status ${proxy.status || 'inactive'}">${getStatusLabel(proxy.status)}</span>
              <button class="button secondary" onclick="testProxy('${proxy.proxyId}')">测试</button>
              <button class="button secondary" onclick="editProxy('${proxy.proxyId}')">编辑</button>
              <button class="button secondary" style="color: #cb2431;" onclick="deleteProxy('${proxy.proxyId}')">删除</button>
            </div>
          </div>
        `).join('');
      }

      function getStatusLabel(status) {
        const labels = {
          'active': '正常',
          'inactive': '未激活',
          'testing': '测试中',
          'failed': '失败'
        };
        return labels[status] || status;
      }

      window.testProxy = async function(proxyId) {
        try {
          showToast('正在测试代理连接...', 'info');
          const response = await fetch('/api/desktop/proxies/test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ proxyId })
          });
          const result = await response.json();

          if (result.ok && result.data.success) {
            showToast(`代理测试成功！出口 IP：${result.data.detectedIp || '未知'}，响应时间：${result.data.responseTime}ms`, 'success');
          } else {
            showToast(`代理测试失败：${result.data?.error || result.error || '未知错误'}`, 'error');
          }

          await loadProxies();
        } catch (error) {
          showToast('测试失败：' + error.message, 'error');
        }
      };

      window.deleteProxy = async function(proxyId) {
        // 用自定义确认弹窗替代 confirm()，Electron 中 confirm 可能不稳定
        const card = document.querySelector(`[onclick="deleteProxy('${proxyId}')"]`).closest('.proxy-card');
        if (!card) return;
        if (card.dataset.confirmDelete === '1') {
          card.dataset.confirmDelete = '';
        } else {
          card.dataset.confirmDelete = '1';
          showToast('再点一次删除按钮确认删除', 'warn');
          setTimeout(() => { if (card) card.dataset.confirmDelete = ''; }, 3000);
          return;
        }

        try {
          await fetch('/api/desktop/proxies/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ proxyId })
          });
          showToast('代理已删除', 'success');
          await loadProxies();
        } catch (error) {
          showToast('删除失败：' + error.message, 'error');
        }
      };

      window.editProxy = function(proxyId) {
        // 通过 API 获取代理详情后填入表单
        fetch(`/api/desktop/proxies/${encodeURIComponent(proxyId)}`)
          .then(r => r.json())
          .then(result => {
            const proxy = result.data || result;
            if (!proxy || !proxy.host) {
              showToast('无法加载代理详情', 'error');
              return;
            }
            editingProxyId = proxyId;
            document.getElementById('proxyModalTitle').textContent = '编辑代理';
            document.getElementById('proxyFormName').value = proxy.name || '';
            document.getElementById('proxyFormType').value = proxy.type || 'http';
            document.getElementById('proxyFormHost').value = proxy.host || '';
            document.getElementById('proxyFormPort').value = proxy.port || '';
            document.getElementById('proxyFormCountry').value = proxy.country || '';
            document.getElementById('proxyFormCity').value = proxy.city || '';
            document.getElementById('proxyFormProxyType').value = proxy.proxyType || 'datacenter';
            document.getElementById('proxyFormNotes').value = proxy.notes || '';
            document.getElementById('proxyModal').hidden = false;
          })
          .catch(error => {
            showToast('加载代理详情失败：' + error.message, 'error');
          });
      };

      // 添加代理按钮
      document.getElementById('addProxyButton').addEventListener('click', () => {
        editingProxyId = null;
        document.getElementById('proxyModalTitle').textContent = '添加代理';
        document.getElementById('proxyFormName').value = '';
        document.getElementById('proxyFormType').value = 'http';
        document.getElementById('proxyFormHost').value = '';
        document.getElementById('proxyFormPort').value = '';
        document.getElementById('proxyFormCountry').value = '';
        document.getElementById('proxyFormCity').value = '';
        document.getElementById('proxyFormProxyType').value = 'datacenter';
        document.getElementById('proxyFormNotes').value = '';
        document.getElementById('proxyModal').hidden = false;
      });

      // 取消按钮
      document.getElementById('proxyModalCancel').addEventListener('click', () => {
        document.getElementById('proxyModal').hidden = true;
      });

      // 保存按钮
      document.getElementById('proxyModalSave').addEventListener('click', async () => {
        const host = document.getElementById('proxyFormHost').value.trim();
        const port = document.getElementById('proxyFormPort').value.trim();
        if (!host || !port) {
          showToast('地址和端口不能为空', 'error');
          return;
        }

        const payload = {
          workspaceId,
          proxyId: editingProxyId || undefined,
          name: document.getElementById('proxyFormName').value.trim() || host,
          type: document.getElementById('proxyFormType').value,
          host,
          port: Number(port),
          country: document.getElementById('proxyFormCountry').value.trim(),
          city: document.getElementById('proxyFormCity').value.trim(),
          proxyType: document.getElementById('proxyFormProxyType').value,
          notes: document.getElementById('proxyFormNotes').value.trim()
        };

        try {
          await fetch('/api/desktop/proxies/upsert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          showToast(editingProxyId ? '代理已更新' : '代理已添加', 'success');
          document.getElementById('proxyModal').hidden = true;
          await loadProxies();
        } catch (error) {
          showToast('保存失败：' + error.message, 'error');
        }
      });

      document.getElementById('importButton').addEventListener('click', async () => {
        const text = document.getElementById('proxyImportText').value.trim();
        if (!text) {
          showToast('请输入代理列表', 'error');
          return;
        }

        try {
          const response = await fetch('/api/desktop/proxies/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, workspaceId })
          });
          const result = await response.json();
          const data = result.data || result;

          showToast(`导入完成！成功：${data.importedCount}，失败：${data.failedCount}`,
            data.importedCount > 0 ? 'success' : 'error');

          document.getElementById('proxyImportText').value = '';
          await loadProxies();
        } catch (error) {
          showToast('导入失败：' + error.message, 'error');
        }
      });

      document.getElementById('exportButton').addEventListener('click', async () => {
        try {
          const response = await fetch(`/api/desktop/proxies/export?workspaceId=${workspaceId}`);
          const result = await response.json();
          const csv = result.data?.csv || result.csv || '';

          const blob = new Blob([csv], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `proxies-${new Date().toISOString().slice(0, 10)}.csv`;
          a.click();
          URL.revokeObjectURL(url);

          showToast('导出成功', 'success');
        } catch (error) {
          showToast('导出失败：' + error.message, 'error');
        }
      });

      function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.hidden = false;
        setTimeout(() => { toast.hidden = true; }, 3000);
      }

      function goBack() {
        const params = new URLSearchParams(window.location.search);
        const ws = params.get('workspaceId') || 'workspace_default';
        const devEmail = params.get('devEmail') || '';
        let url = window.location.origin + '/manager/?desktop=1&appMode=1&workspaceId=' + ws;
        if (devEmail) url += '&devEmail=' + encodeURIComponent(devEmail);
        window.location.href = url;
      }
      window.goBack = goBack;

      loadProxies();
    </script>
  </body>
</html>
