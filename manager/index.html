<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Creator OS 桌面版</title>
    <link rel="stylesheet" href="/manager/style.css?v=20260620-status-center">
  </head>
  <body>
    <header class="shell-header">
      <div>
        <p class="eyebrow">AI Creator OS 桌面版</p>
        <h1>多账号 X 运营工具箱</h1>
        <p class="subtitle" id="statusText">读取本地账号工具箱...</p>
      </div>
      <div class="header-actions">
        <label class="user-select">
          <span>数据空间</span>
          <select id="workspaceSelect"></select>
        </label>
        <label class="user-select">
          <span>操作者</span>
          <select id="managerSelect"></select>
        </label>
        <button class="button secondary" id="refreshButton" type="button">刷新</button>
        <button class="button secondary access-logout" id="accessLogoutButton" type="button" hidden>退出 / 切换邮箱</button>
      </div>
    </header>

    <main>
      <section class="notice" id="modeNotice">
        <strong>本地桌面工具箱：</strong>
        本地管理账号、任务、目标关系和数据反馈。支持网络/IP 检测和浏览器指纹配置，不保存账号密码、cookie，不自动关注、点赞、评论或发推。
      </section>

      <section class="metrics" id="metrics"></section>

      <section class="layout">
        <aside class="panel">
          <h2>账号工具箱</h2>
          <div id="workspaceResources"></div>
          <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <button class="button secondary" onclick="window.location.href='/manager/proxy-manager.html?desktop=1&appMode=1&workspaceId=' + (new URLSearchParams(window.location.search).get('workspaceId') || 'workspace_default')">网络/IP 管理</button>
            <button class="button secondary" onclick="window.location.href='/manager/fingerprint-manager.html?desktop=1&appMode=1&workspaceId=' + (new URLSearchParams(window.location.search).get('workspaceId') || 'workspace_default')">浏览器指纹</button>
          </div>
          <div id="accountVault" class="account-vault"></div>
        </aside>

        <section class="panel task-panel">
          <div class="panel-head">
            <div>
              <h2>任务</h2>
              <p id="taskHint">复制文案、人工发布、回来补数据。桌面版不自动发推。</p>
            </div>
            <select id="statusFilter" aria-label="任务状态">
              <option value="all">全部</option>
              <option value="pending">待确认</option>
              <option value="approved">已确认</option>
              <option value="rejected">已拒绝</option>
              <option value="unassigned">未分配</option>
              <option value="blocked">不可批</option>
            </select>
          </div>
          <div id="batchBar" class="batch-bar"></div>
          <div id="tasks" class="task-list"></div>
        </section>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="drawer-backdrop" id="accountDrawerBackdrop" hidden></div>
    <aside class="account-drawer" id="accountDrawer" hidden aria-label="账号详情"></aside>
    <script type="module" src="/manager/js/app.js?v=20260620-status-center"></script>
  </body>
</html>
