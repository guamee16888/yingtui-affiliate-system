<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Creator OS 管理端</title>
    <link rel="stylesheet" href="/manager/style.css">
  </head>
  <body>
    <header class="shell-header">
      <div>
        <p class="eyebrow">AI Creator OS · Manager Console</p>
        <h1>AI Creator OS 管理端</h1>
        <p class="subtitle" id="statusText">读取 workspace 任务中...</p>
      </div>
      <div class="header-actions">
        <label class="user-select">
          <span>Workspace</span>
          <select id="workspaceSelect"></select>
        </label>
        <label class="user-select">
          <span>主管</span>
          <select id="managerSelect"></select>
        </label>
        <button class="button secondary" id="refreshButton" type="button">刷新</button>
        <a class="button secondary" id="staffLink" href="/staff/">员工台</a>
      </div>
    </header>

    <main>
      <section class="notice">
        <strong>客户/主管用的多账号 X 内容运营管理端。</strong>
        管理当前 workspace 的账号、任务、审核、发布和反馈。如需修改数据源或全局发布策略，请联系平台管理员。
      </section>

      <section class="metrics" id="metrics"></section>

      <nav class="manager-tabs" id="managerTabs" aria-label="Manager tabs"></nav>
      <section class="manager-view" id="managerView"></section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/manager/js/app.js"></script>
  </body>
</html>
