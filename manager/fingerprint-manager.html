<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>浏览器指纹管理 - AI Creator OS</title>
    <link rel="stylesheet" href="/manager/style.css?v=20260615-fingerprint">
    <style>
      .fingerprint-grid {
        display: grid;
        gap: 16px;
        margin-top: 16px;
      }
      .fingerprint-card {
        background: white;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        padding: 16px;
      }
      .fingerprint-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .fingerprint-header h3 {
        margin: 0;
        font-size: 16px;
      }
      .fingerprint-details {
        font-size: 13px;
        color: #586069;
        line-height: 1.6;
      }
      .fingerprint-details code {
        background: #f6f8fa;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 12px;
      }
      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .info-item {
        padding: 8px;
        background: #f6f8fa;
        border-radius: 4px;
      }
      .info-item label {
        display: block;
        font-size: 11px;
        color: #586069;
        margin-bottom: 4px;
        text-transform: uppercase;
      }
      .info-item span {
        font-size: 14px;
        font-weight: 500;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: auto;
        background: rgba(16, 24, 20, 0.46);
        backdrop-filter: blur(10px);
      }
      .modal-card {
        width: min(560px, 100%);
        display: grid;
        gap: 16px;
        padding: 22px;
        border: 1px solid var(--line, #dfe5dc);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 28px 90px rgba(22, 34, 28, 0.24);
      }
      .modal-card h2 { margin: 0; font-size: 18px; }
      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .modal-grid .field {
        display: grid;
        gap: 5px;
        color: #647067;
        font-size: 13px;
      }
      .modal-grid .field.full { grid-column: 1 / -1; }
      .modal-grid input,
      .modal-grid select {
        width: 100%;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid #dfe5dc;
        border-radius: 8px;
        font: inherit;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .safety-note {
        padding: 10px 12px;
        color: #526159;
        border: 1px solid #d8e5dd;
        border-radius: 12px;
        background: #f7fbf8;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <header class="shell-header">
      <div>
        <p class="eyebrow">AI Creator OS 桌面版</p>
        <h1>浏览器指纹管理</h1>
        <p class="subtitle">为每个账号配置独立浏览器指纹，防止账号关联</p>
      </div>
      <div class="header-actions">
        <button class="button secondary" onclick="goBack()">返回账号列表</button>
        <button class="button" id="generateButton">随机生成指纹</button>
      </div>
    </header>

    <main>
      <div class="safety-note">
        <strong>产品边界：</strong>指纹配置仅用于设置固定窗口的 User-Agent、语言和时区。不修改 Electron session partition（固定窗口始终使用 persist:aicos:workspaceId:accountId），不读取真实浏览器指纹，不自动伪装。
      </div>

      <section class="notice">
        <strong>指纹隔离原理：</strong>
        每个指纹配置包含独立的 User-Agent、屏幕分辨率、时区、语言等特征。系统不会读取、保存或导出真实浏览器的指纹数据。指纹配置不会改变账号的 session partition。
      </section>

      <section class="panel">
        <h2>指纹配置列表 <span id="fingerprintCount" style="color: #586069; font-weight: normal;"></span></h2>
        <div id="fingerprintGrid" class="fingerprint-grid"></div>
      </section>
    </main>

    <!-- 编辑指纹弹窗 -->
    <div class="modal-backdrop" id="fpModal" hidden>
      <div class="modal-card">
        <h2 id="fpModalTitle">编辑指纹配置</h2>
        <div class="modal-grid">
          <label class="field full"><span>名称</span><input id="fpFormName" type="text" placeholder="例如：Chrome Windows US"></label>
          <label class="field"><span>平台</span>
            <select id="fpFormPlatform">
              <option value="Win32">Windows</option>
              <option value="MacIntel">macOS</option>
            </select>
          </label>
          <label class="field"><span>语言</span>
            <select id="fpFormLanguage">
              <option value="en-US">en-US</option>
              <option value="en-GB">en-GB</option>
              <option value="ja">ja</option>
              <option value="zh-CN">zh-CN</option>
            </select>
          </label>
          <label class="field"><span>时区</span>
            <select id="fpFormTimezone">
              <option value="-8">UTC-8 (PST)</option>
              <option value="-5">UTC-5 (EST)</option>
              <option value="0">UTC+0 (GMT)</option>
              <option value="1">UTC+1 (CET)</option>
              <option value="8">UTC+8 (CST)</option>
              <option value="9">UTC+9 (JST)</option>
            </select>
          </label>
          <label class="field"><span>屏幕</span>
            <select id="fpFormScreen">
              <option value="1920x1080">1920x1080</option>
              <option value="2560x1440">2560x1440</option>
              <option value="1366x768">1366x768</option>
              <option value="1440x900">1440x900</option>
            </select>
          </label>
          <label class="field full"><span>User-Agent</span><input id="fpFormUserAgent" type="text" placeholder="留空则根据平台自动生成"></label>
          <label class="field full"><span>备注</span><input id="fpFormNotes" type="text" placeholder="可选"></label>
        </div>
        <input type="hidden" id="fpFormFingerprintId">
        <input type="hidden" id="fpFormFingerprintData">
        <div class="modal-actions">
          <button class="button secondary" id="fpModalCancel">取消</button>
          <button class="button" id="fpModalSave">保存</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module">
      const workspaceId = new URLSearchParams(window.location.search).get('workspaceId') || 'workspace_default';
      let fingerprintCache = [];

      async function loadFingerprints() {
        try {
          const response = await fetch(`/api/desktop/fingerprints?workspaceId=${workspaceId}`);
          const result = await response.json();
          const items = result.data?.items || result.items || [];
          fingerprintCache = items;
          renderFingerprints(items);
          document.getElementById('fingerprintCount').textContent = `(${items.length} 个)`;
        } catch (error) {
          showToast('加载指纹列表失败：' + error.message, 'error');
        }
      }

      function renderFingerprints(fingerprints) {
        const grid = document.getElementById('fingerprintGrid');

        if (fingerprints.length === 0) {
          grid.innerHTML = `
            <div style="text-align: center; padding: 40px; color: #586069;">
              <p>暂无指纹配置</p>
              <p style="font-size: 14px; margin-top: 8px;">点击右上角"随机生成指纹"按钮创建新配置</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = fingerprints.map(fp => `
          <div class="fingerprint-card">
            <div class="fingerprint-header">
              <h3>${fp.name}</h3>
              <div style="display: flex; gap: 8px;">
                <button class="button secondary" onclick="editFingerprint('${fp.fingerprintId}')">编辑</button>
                <button class="button secondary" style="color: #cb2431;" onclick="deleteFingerprint('${fp.fingerprintId}')">删除</button>
              </div>
            </div>
            <div class="fingerprint-details">
              <div class="info-grid">
                <div class="info-item">
                  <label>平台</label>
                  <span>${fp.fingerprint?.platform || 'Win32'}</span>
                </div>
                <div class="info-item">
                  <label>语言</label>
                  <span>${fp.fingerprint?.language || 'en-US'}</span>
                </div>
                <div class="info-item">
                  <label>时区</label>
                  <span>${fp.fingerprint?.timezoneString || 'UTC+0'}</span>
                </div>
                <div class="info-item">
                  <label>屏幕</label>
                  <span>${fp.fingerprint?.screen?.width || 1920}x${fp.fingerprint?.screen?.height || 1080}</span>
                </div>
              </div>
              <div style="margin-top: 12px; padding: 8px; background: #fff; border: 1px solid #e1e4e8; border-radius: 4px;">
                <label style="display: block; font-size: 11px; color: #586069; margin-bottom: 4px;">User-Agent</label>
                <code style="font-size: 11px; word-break: break-all;">${fp.fingerprint?.userAgent || 'N/A'}</code>
              </div>
              ${fp.notes ? `<p style="margin-top: 12px; font-size: 13px;">${fp.notes}</p>` : ''}
            </div>
          </div>
        `).join('');
      }

      window.deleteFingerprint = async function(fingerprintId) {
        // 用二次点击确认替代 confirm()，Electron 中 confirm 可能不稳定
        const card = document.querySelector(`[onclick="deleteFingerprint('${fingerprintId}')"]`).closest('.fingerprint-card');
        if (!card) return;
        if (card.dataset.confirmDelete === '1') {
          card.dataset.confirmDelete = '';
        } else {
          card.dataset.confirmDelete = '1';
          showToast('再点一次删除按钮确认删除', 'warn');
          setTimeout(() => { if (card) card.dataset.confirmDelete = ''; }, 3000);
          return;
        }

        try {
          await fetch('/api/desktop/fingerprints/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fingerprintId })
          });
          showToast('指纹配置已删除', 'success');
          await loadFingerprints();
        } catch (error) {
          showToast('删除失败：' + error.message, 'error');
        }
      };

      window.editFingerprint = function(fingerprintId) {
        const fp = fingerprintCache.find(f => f.fingerprintId === fingerprintId);
        if (!fp) {
          showToast('找不到指纹配置', 'error');
          return;
        }

        document.getElementById('fpModalTitle').textContent = '编辑指纹配置';
        document.getElementById('fpFormFingerprintId').value = fp.fingerprintId;
        document.getElementById('fpFormName').value = fp.name || '';
        document.getElementById('fpFormPlatform').value = fp.fingerprint?.platform || 'Win32';
        document.getElementById('fpFormLanguage').value = fp.fingerprint?.language || 'en-US';
        document.getElementById('fpFormTimezone').value = String(fp.fingerprint?.timezone ?? 0);
        document.getElementById('fpFormScreen').value = `${fp.fingerprint?.screen?.width || 1920}x${fp.fingerprint?.screen?.height || 1080}`;
        document.getElementById('fpFormUserAgent').value = fp.fingerprint?.userAgent || '';
        document.getElementById('fpFormNotes').value = fp.notes || '';
        document.getElementById('fpFormFingerprintData').value = JSON.stringify(fp.fingerprint || {});
        document.getElementById('fpModal').hidden = false;
      };

      document.getElementById('fpModalCancel').addEventListener('click', () => {
        document.getElementById('fpModal').hidden = true;
      });

      document.getElementById('fpModalSave').addEventListener('click', async () => {
        const fingerprintId = document.getElementById('fpFormFingerprintId').value;
        const name = document.getElementById('fpFormName').value.trim() || '未命名指纹';
        const platform = document.getElementById('fpFormPlatform').value;
        const language = document.getElementById('fpFormLanguage').value;
        const timezone = Number(document.getElementById('fpFormTimezone').value);
        const screenVal = document.getElementById('fpFormScreen').value;
        const [screenWidth, screenHeight] = screenVal.split('x').map(Number);
        const userAgent = document.getElementById('fpFormUserAgent').value.trim();
        const notes = document.getElementById('fpFormNotes').value.trim();

        // 构建 fingerprint 数据
        let fingerprintData = {};
        try {
          fingerprintData = JSON.parse(document.getElementById('fpFormFingerprintData').value || '{}');
        } catch {}

        // 覆盖用户修改的字段
        Object.assign(fingerprintData, {
          platform,
          language,
          languages: [language],
          timezone,
          timezoneString: `UTC${timezone >= 0 ? '+' : ''}${timezone}:00`,
          screen: { width: screenWidth, height: screenHeight, colorDepth: 24, devicePixelRatio: 1 }
        });
        if (userAgent) fingerprintData.userAgent = userAgent;

        const payload = {
          fingerprintId: fingerprintId || undefined,
          name,
          fingerprint: fingerprintData,
          preset: 'custom',
          workspaceId,
          notes
        };

        try {
          const response = await fetch('/api/desktop/fingerprints/upsert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(`保存失败：HTTP ${response.status}`);
          }

          showToast(fingerprintId ? '指纹配置已更新' : '指纹配置已创建', 'success');
          document.getElementById('fpModal').hidden = true;
          await loadFingerprints();
        } catch (error) {
          showToast('保存失败：' + error.message, 'error');
        }
      });

      document.getElementById('generateButton').addEventListener('click', async () => {
        // 自动生成名称，不用 prompt()（Electron 中 prompt 不稳定）
        const autoName = `指纹配置 ${fingerprintCache.length + 1}`;

        try {
          showToast('正在生成指纹...', 'info');

          const generateResponse = await fetch('/api/desktop/fingerprints/generate');
          if (!generateResponse.ok) {
            throw new Error(`生成失败：HTTP ${generateResponse.status}`);
          }
          const fingerprint = await generateResponse.json();

          const upsertResponse = await fetch('/api/desktop/fingerprints/upsert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: autoName,
              fingerprint,
              preset: 'custom',
              workspaceId
            })
          });

          if (!upsertResponse.ok) {
            throw new Error(`保存失败：HTTP ${upsertResponse.status}`);
          }

          showToast('指纹配置已创建：' + autoName, 'success');
          await loadFingerprints();
        } catch (error) {
          console.error('创建指纹失败:', error);
          showToast('创建失败：' + error.message, 'error');
        }
      });

      function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.hidden = false;
        setTimeout(() => { toast.hidden = true; }, 3000);
      }

      function goBack() {
        const params = new URLSearchParams(window.location.search);
        const ws = params.get('workspaceId') || 'workspace_default';
        const devEmail = params.get('devEmail') || '';
        let url = window.location.origin + '/manager/?desktop=1&appMode=1&workspaceId=' + ws;
        if (devEmail) url += '&devEmail=' + encodeURIComponent(devEmail);
        window.location.href = url;
      }
      window.goBack = goBack;

      loadFingerprints();
    </script>
  </body>
</html>
